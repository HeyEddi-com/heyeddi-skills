# Create a GitHub Release when main advances and the hub version is untagged.
#
# Version SSOT: skills-registry.json → .version  (e.g. 3.2.0 → tag v3.2.0)
# Packs: packs/heyeddi-skills.json + packs/heyeddi-ci-skills.json (attached as assets)
#
# Does NOT bump the version. Bump in the PR, merge to main; this tags if missing.
# Idempotent when the tag already exists.
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync plugins from packs
        run: ./scripts/sync-plugins.sh --link

      - name: Read hub version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('skills-registry.json'))['version'])")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid skills-registry.json version: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          FULL_PACK_VER="$(python3 -c "import json; print(json.load(open('packs/heyeddi-skills.json'))['version'])")"
          CI_PACK_VER="$(python3 -c "import json; print(json.load(open('packs/heyeddi-ci-skills.json'))['version'])")"
          if [[ "$FULL_PACK_VER" != "$VERSION" ]]; then
            echo "packs/heyeddi-skills.json version ($FULL_PACK_VER) must match registry ($VERSION)" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ci_pack_version=${CI_PACK_VER}" >> "$GITHUB_OUTPUT"
          echo "Hub ${VERSION} -> ${TAG} (CI pack ${CI_PACK_VER})"

      - name: Check whether tag exists
        id: tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet"
          fi

      - name: Write release notes
        if: steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/write-release-notes.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            -o /tmp/heyeddi-skills-release-notes.md

      - name: Create GitHub Release (both packs)
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Stable asset names for consumers / Marketplace tooling
          cp packs/heyeddi-skills.json /tmp/heyeddi-skills.json
          cp packs/heyeddi-ci-skills.json /tmp/heyeddi-ci-skills.json
          gh release create "$TAG" \
            --title "HeyEddi Skills ${TAG}" \
            --notes-file /tmp/heyeddi-skills-release-notes.md \
            --generate-notes \
            --target "${{ github.sha }}" \
            /tmp/heyeddi-skills.json \
            /tmp/heyeddi-ci-skills.json
          echo "Created release ${TAG} at ${{ github.sha }} with pack assets"

      - name: Publish CI pack mirror (heyeddi-ci-skills)
        if: steps.tag.outputs.exists == 'false'
        env:
          # Prefer a PAT/fine-grained token with contents:write on heyeddi-ci-skills.
          # Falls back to GITHUB_TOKEN (same-repo only unless org grants cross-repo).
          GH_TOKEN: ${{ secrets.CI_PACK_PUSH_TOKEN || github.token }}
          CI_PACK_VER: ${{ steps.ver.outputs.ci_pack_version }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          ./scripts/publish-ci-pack-repo.sh --out "$STAGE"
          # Clone existing mirror (or create empty remote first via maintainer)
          WORK="$(mktemp -d)"
          if gh repo view HeyEddi-com/heyeddi-ci-skills >/dev/null 2>&1; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/HeyEddi-com/heyeddi-ci-skills.git" "$WORK"
            rsync -a --delete --exclude .git "$STAGE"/ "$WORK"/
            git -C "$WORK" config user.name "github-actions[bot]"
            git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$WORK" add -A
            if git -C "$WORK" diff --cached --quiet; then
              echo "CI pack mirror already up to date"
            else
              git -C "$WORK" commit -m "chore: sync heyeddi-ci-skills pack v${CI_PACK_VER} from hub"
              git -C "$WORK" push origin HEAD:main
            fi
            TAG="v${CI_PACK_VER}"
            if ! git -C "$WORK" rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git -C "$WORK" tag -a "$TAG" -m "HeyEddi CI Skills ${TAG}"
              git -C "$WORK" push origin "$TAG" || true
            fi
            if ! gh release view "$TAG" --repo HeyEddi-com/heyeddi-ci-skills >/dev/null 2>&1; then
              gh release create "$TAG" --repo HeyEddi-com/heyeddi-ci-skills \
                --title "HeyEddi CI Skills ${TAG}" \
                --notes "Published mirror of pack \`heyeddi-ci-skills\` v${CI_PACK_VER} from HeyEddi-com/heyeddi-skills.

\`\`\`bash
npx skills add HeyEddi-com/heyeddi-ci-skills -a cursor -y --skill '*'
\`\`\`
"
            fi
          else
            echo "::warning::HeyEddi-com/heyeddi-ci-skills does not exist yet — create it and re-run, or push locally with ./scripts/publish-ci-pack-repo.sh --push"
          fi

      - name: Summary
        run: |
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hub tag: \`${{ steps.ver.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full pack: **heyeddi-skills** @ ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI pack: **heyeddi-ci-skills** @ ${{ steps.ver.outputs.ci_pack_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- skills.sh: heyeddi-skills + heyeddi-ci-skills" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.tag.outputs.exists }}" == "true" ]]; then
            echo "- Status: tag already existed (no-op)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: created GitHub Release + pack JSON assets (+ CI mirror if configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
