# CI for HeyEddi skills hub — packs sync, unit tests, smoke, static skill security.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: packs + pytest + smoke + skill-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # test_version_bump compares against release tags

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync Python deps
        run: uv sync --group dev

      - name: Sync plugins from packs
        run: ./scripts/sync-plugins.sh --link

      - name: Pack / registry consistency
        run: |
          set -euo pipefail
          REG_VER="$(python3 -c "import json; print(json.load(open('skills-registry.json'))['version'])")"
          FULL_VER="$(python3 -c "import json; print(json.load(open('packs/heyeddi-skills.json'))['version'])")"
          test "$REG_VER" = "$FULL_VER"
          python3 -c "
          import json
          from pathlib import Path
          reg_doc = json.load(open('skills-registry.json'))
          reg = {s['name'] for s in reg_doc['skills']}
          full = set(json.load(open('packs/heyeddi-skills.json'))['skills'])
          ci = set(json.load(open('packs/heyeddi-ci-skills.json'))['skills'])
          design = set(json.load(open('packs/heyeddi-design-skills.json'))['skills'])
          assert full == reg, (full ^ reg)
          assert ci <= full
          assert design <= full
          for name in full:
              assert (Path('skills') / name / 'SKILL.md').is_file(), name
          print('ok: hub %s, full=%d, ci=%d, design=%d' % (reg_doc['version'], len(full), len(ci), len(design)))
          "

      - name: pytest
        run: uv run pytest tests/ -q --tb=line

      - name: Skill smoke (poe test)
        run: uv run poe test

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install skill security CLIs
        run: npm ci

      - name: skill-trust + skills-check
        run: ./scripts/skill-security-scan.sh
